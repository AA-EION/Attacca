name: Comprobacion

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Un empujon nuevo deja sin objeto la comprobacion del anterior. Cancelarla
# libera las maquinas y evita que una ejecucion obsoleta —o colgada— siga
# ocupandolas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Nucleo y linea de ordenes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # El nucleo y la linea de ordenes no dependen de la plataforma grafica:
      # se comprueban en los tres sistemas sin instalar nada mas.
      - name: Formato
        run: cargo fmt --all -- --check

      # En una sola linea a proposito. La barra invertida continua una linea en
      # bash y no en PowerShell, que es la consola de la maquina de Windows: ahi
      # la orden se partia en dos y la segunda mitad no existia.
      - name: Clippy
        run: cargo clippy --workspace --exclude attacca-app --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test -p attacca-core -p attacca-cli -p attacca-ordenes -p attacca-ffi

      # El apartado 42 exige que el material sea utilizable sin la aplicacion.
      # Esto lo comprueba con las utilidades del sistema, no con Attacca.
      - name: Contenedor extraible sin la aplicacion
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash scripts/comprobar-interoperabilidad.sh

      # El apartado 7 del encargo exige que las reglas de redaccion se puedan
      # auditar sin recorrer el codigo. Todo el texto visible esta en un archivo.
      - name: Reglas de redaccion de la interfaz
        if: matrix.os == 'ubuntu-22.04'
        run: python3 scripts/auditar-redaccion.py

      # Un flujo mal escrito no falla: no llega a ejecutarse, y la publicacion
      # se descubre rota el dia de la version. `release.yml` solo corre al
      # etiquetar, de modo que esta es la unica comprobacion que recibe.
      - name: Flujos de trabajo
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          version=1.7.7
          curl -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint
          ./actionlint

      # El arranque en frio debe estar por debajo de dos segundos con
      # quinientos proyectos indexados.
      - name: Presupuesto de arranque en frio
        run: cargo test -p attacca-core --release arranque_en_frio -- --nocapture

  # La interfaz nativa de macOS. Se compila y se prueba aparte porque solo
  # existe ahi: es la unica maquina de la matriz con Swift y con el SDK que
  # trae Liquid Glass.
  nativa-macos:
    name: Interfaz nativa de macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: nativa-macos

      # La maquina trae varias versiones de Xcode. Liquid Glass solo se compila
      # con el SDK de macOS 26, asi que se elige la mas reciente que haya. Si no
      # llega a 26, el guion lo detecta y compila sin cristal: el trabajo pasa
      # igual y el registro dice cual de las dos cosas ocurrio.
      - name: Elegir el Xcode mas reciente
        run: |
          set -euo pipefail
          # Con el propio glob en lugar de `ls`: un nombre con espacios partiria
          # la lista, y ordenar por version necesita -V, no el orden del glob,
          # que pondria Xcode_9 despues de Xcode_26.
          printf '%s\n' /Applications/Xcode*.app
          ultimo=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          # Si no hay ninguno, el glob queda sin expandir y no es un directorio.
          if [ -d "$ultimo" ]; then
            sudo xcode-select -s "$ultimo"
          fi
          xcodebuild -version
          swift --version

      # El guion comprueba el encabezado, funde las dos bibliotecas del nucleo,
      # ejecuta las pruebas del puente y verifica que el .app es universal. Si
      # algo de eso falla, falla aqui y no el dia de la publicacion.
      - name: Construir Attacca.app universal
        run: ./app/macos/construir.sh --pruebas

      # Se sube el .dmg y no la carpeta .app: al subir una carpeta, el artefacto
      # se comprime en un zip que no conserva el bit de ejecucion, y lo que se
      # descarga no abre. La imagen de disco si conserva los permisos.
      - uses: actions/upload-artifact@v4
        with:
          name: attacca-macos-nativa-dmg
          path: |
            app/macos/salida/Attacca-macos-nativa.dmg
            app/macos/salida/Attacca-macos-nativa.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  # Los tres artefactos se producen en cada cambio, no solo al publicar: un
  # paquete que solo se construye el dia de la version es un paquete sin probar.
  paquetes:
    name: Paquetes
    needs: nucleo
    uses: ./.github/workflows/construir.yml
    with:
      firmar: false
