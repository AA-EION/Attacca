[workspace]
resolver = "2"
members = ["crates/attacca-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/AA-EION/Attacca"

[workspace.dependencies]
attacca-core = { path = "crates/attacca-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
yaml-rust2 = "0.10"
getrandom = "0.2"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
