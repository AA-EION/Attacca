[package]
name = "attacca-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Núcleo normativo de Attacca. Implementa STAVE 2.0 sobre el árbol de archivos."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
time = { workspace = true }
yaml-rust2 = { workspace = true }
getrandom = { workspace = true }
# TLS con rustls y el almacen de confianza del sistema operativo. Evita
# depender de OpenSSL: el paquete distribuible queda autocontenido y la
# autoridad de certificacion de una red corporativa sigue reconociendose.
ureq = { version = "2", default-features = false, features = ["tls", "socks-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_RestartManager",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
zip = { workspace = true }
